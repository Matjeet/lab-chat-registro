plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.arquetipo'
version = '0.0.1-SNAPSHOT'
description = 'Arquetipo base MVC para servicios backend con Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.1'
}

dependencies {
	// --- Web / MVC ---
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- Persistencia ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'          // solo para los slices de test (@DataJpaTest, @SpringBootTest)

	// --- Migraciones de esquema (Flyway) ---
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'

	// --- Identidad (Firebase Auth como proveedor externo) ---
	implementation 'com.google.firebase:firebase-admin:9.4.3'
	// Transporte HTTP alternativo (Apache HttpClient) para el SDK de Firebase: el transporte
	// por defecto (NetHttpTransport, sobre HttpURLConnection) puede chocar con inspeccion de
	// trafico de terceros en la maquina (antivirus/EDR) que corrompe la respuesta gzip.
	implementation 'com.google.http-client:google-http-client-apache-v2:1.45.3'

	// --- Observabilidad ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Documentacion de API (OpenAPI / Swagger UI) ---
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- Utilidades de desarrollo ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
	// Los tests NO leen .env: corren siempre sobre H2 en memoria.
}

// Carga el fichero .env (si existe) en el entorno de `bootRun`, para no tener que
// exportar las variables a mano en desarrollo. Solo afecta a la ejecucion local:
// en produccion/CI las variables las inyecta el entorno y en los tests no se usan.
// Una variable ya presente en el entorno real tiene prioridad sobre la del .env.
tasks.named('bootRun') {
	def dotenv = rootProject.file('.env')
	doFirst {
		if (!dotenv.exists()) return
		dotenv.readLines('UTF-8').each { rawLine ->
			def line = rawLine.trim()
			if (line.isEmpty() || line.startsWith('#')) return
			def sep = line.indexOf('=')
			if (sep <= 0) return
			def key = line.substring(0, sep).trim()
			if (System.getenv(key) != null) return
			def value = line.substring(sep + 1).trim()
			if (value.length() >= 2 &&
					((value.startsWith('"') && value.endsWith('"')) ||
					 (value.startsWith("'") && value.endsWith("'")))) {
				value = value.substring(1, value.length() - 1)
			}
			environment(key, value)
		}
	}
}

// Solo se publica el jar ejecutable de Spring Boot (evita el "-plain.jar").
tasks.named('jar') {
	enabled = false
}
