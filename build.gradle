plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.6'
}

group = 'com.arquetipo'
version = '0.0.1-SNAPSHOT'
description = 'Arquetipo base MVC para servicios backend con Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

ext {
	springdocVersion = '3.1.1'
	grpcVersion = '1.68.1'
	protobufVersion = '4.28.2'
}

dependencies {
	// --- Web / MVC ---
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// --- Persistencia ---
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'          // solo para los slices de test (@DataJpaTest, @SpringBootTest)

	// --- Migraciones de esquema (Flyway) ---
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	runtimeOnly 'org.flywaydb:flyway-mysql'

	// --- Identidad (Firebase Auth como proveedor externo) ---
	implementation 'com.google.firebase:firebase-admin:9.4.3'
	// Transporte HTTP alternativo (Apache HttpClient) para el SDK de Firebase: el transporte
	// por defecto (NetHttpTransport, sobre HttpURLConnection) puede chocar con inspeccion de
	// trafico de terceros en la maquina (antivirus/EDR) que corrompe la respuesta gzip.
	implementation 'com.google.http-client:google-http-client-apache-v2:1.45.3'

	// --- Observabilidad ---
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// --- Documentacion de API (OpenAPI / Swagger UI) ---
	implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

	// --- gRPC (segundo protocolo de transporte para el mismo contrato de registro) ---
	// El servidor se levanta a mano (com.arquetipo.demo.common.grpc), sin starter de terceros,
	// para no atarse a la compatibilidad de un starter externo con esta version de Spring Boot.
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation "io.grpc:grpc-services:${grpcVersion}"  // habilita el servicio de reflexion (grpcurl sin .proto)
	implementation "com.google.protobuf:protobuf-java:${protobufVersion}"
	compileOnly 'jakarta.annotation:jakarta.annotation-api'  // @Generated en los stubs generados

	// --- Utilidades de desarrollo ---
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// --- Test ---
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testImplementation "io.grpc:grpc-testing:${grpcVersion}"  // InProcessServerBuilder para probar el servicio gRPC sin red real
}

tasks.named('test') {
	useJUnitPlatform()
	// Los tests NO leen .env: corren siempre sobre H2 en memoria.
}

// Genera los stubs de gRPC/protobuf a partir de src/main/proto/*.proto (build/generated/source/proto).
protobuf {
	protoc {
		artifact = "com.google.protobuf:protoc:${protobufVersion}"
	}
	plugins {
		grpc {
			artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
		}
	}
	generateProtoTasks {
		all().configureEach {
			plugins {
				grpc {}
			}
		}
	}
}

// La carga de .env vive DENTRO de la aplicacion (ver
// com.arquetipo.demo.common.env.DotenvEnvironmentPostProcessor), no aqui: asi funciona igual
// arrancando con `./gradlew bootRun`, desde el IDE, o como jar. No hace falta nada especial
// en esta tarea.

// Solo se publica el jar ejecutable de Spring Boot (evita el "-plain.jar").
tasks.named('jar') {
	enabled = false
}
