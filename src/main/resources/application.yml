spring:
  application:
    name: chat-registro

  # Instancia MySQL centralizada y COMPARTIDA por todos los microservicios.
  # Este servicio usa su propio esquema y su propio usuario (ver src/main/resources/db/bootstrap.sql).
  # Las credenciales se sobreescriben por variables de entorno en cada despliegue.
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chat_registro?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:chat_registro_svc}
    password: ${DB_PASSWORD:chat_registro_pw}

  # El esquema lo gestiona Flyway con las migraciones de src/main/resources/db/migration.
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      # Hibernate NO toca el esquema: solo comprueba que las tablas cuadran con las entidades.
      # El DDL lo aplica Flyway. Override con JPA_DDL_AUTO solo en casos puntuales.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate.format_sql: true

  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
        one-indexed-parameters: false

firebase:
  # Firebase Auth como proveedor de identidad externo (com.arquetipo.demo.registro.identidad).
  # false desactiva por completo la inicializacion del SDK (los tests lo hacen).
  enabled: ${FIREBASE_ENABLED:true}
  # Ruta a la clave de la cuenta de servicio (JSON descargado de la consola de Firebase).
  # Vacio = usar las credenciales por defecto del entorno (ADC / GOOGLE_APPLICATION_CREDENTIALS).
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}

grpc:
  server:
    # Servidor gRPC embebido (com.arquetipo.demo.common.grpc), espejo del REST de registro.
    # false desactiva por completo su arranque (los tests lo hacen, ver src/test/resources).
    enabled: ${GRPC_SERVER_ENABLED:true}
    # Puerto TCP propio, independiente de server.port (HTTP).
    port: ${GRPC_SERVER_PORT:9090}

app:
  cors:
    # Origenes permitidos para /api/**. Lista separada por comas, cada uno con esquema +
    # host + puerto y SIN barra final (p. ej. "https://chat.example.com,http://localhost:3000").
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    com.arquetipo.demo: DEBUG
