syntax = "proto3";

package com.arquetipo.demo.registro.grpc;

option java_multiple_files = true;
option java_package = "com.arquetipo.demo.registro.grpc";
option java_outer_classname = "RegistroProto";

// Alta y consulta de usuarios de chat-registro (RegistroService). Unico protocolo que
// expone este servicio; el REST del sistema lo sirve chat-gateway, que reenvia aqui.
service RegistroGrpcService {
  rpc Registrar (RegistrarUsuarioRequest) returns (RegistrarUsuarioResponse);

  // Resuelve username/email/avatar a partir del uid de Firebase de una sesion ya autenticada. Quien
  // llama (siempre chat-gateway, nunca el cliente final) ya autentico y autorizo la peticion
  // el mismo antes de llegar aqui -- este servicio no valida tokens de identidad, confia en
  // que el uid que recibe ya fue verificado. NOT_FOUND si el uid no corresponde a ningun
  // usuario registrado.
  rpc BuscarUsuarioPorUid (BuscarUsuarioPorUidRequest) returns (BuscarUsuarioPorUidResponse);

  // Solo dice si un username ya esta en uso (sin distinguir mayusculas), pensado para
  // validacion en vivo mientras se escribe (p. ej. un formulario de registro). No revela
  // nada mas del usuario -- a diferencia de Registrar, esto es intencionalmente una consulta
  // de disponibilidad, no un dato protegido contra enumeracion.
  rpc ExisteUsername (ExisteUsernameRequest) returns (ExisteUsernameResponse);
}

// Mismos campos y las mismas reglas que RegistroRequest (web/dto/RegistroRequest.java):
// username (3-50, solo letras/numeros/._-), email (formato valido, max 255), password
// (8-20, mayuscula+minuscula+numero+especial, sin 4+ repetidos seguidos). La validacion la
// aplica el servidor con el mismo Validator de Bean Validation, no la duplica este .proto.
message RegistrarUsuarioRequest {
  string username = 1;
  string email = 2;
  string password = 3;

  // Avatar del usuario. Opcional -- proto3 no distingue "avatar ausente" de cadena vacia,
  // "" se trata como "sin avatar" (null), igual que si no se hubiera asignado el campo. Solo
  // se admiten dos formatos, nada mas (ver el @Pattern de RegistroRequest en
  // web/dto/RegistroRequest.java, que es la fuente de verdad de la validacion):
  //   - Un enlace http(s) comun.
  //   - Una etiqueta <Blobatar .../> (avatar animado generado por la libreria "Blobatar"),
  //     que el frontend renderiza tal cual, sin interpretarla.
  // Si el valor llega envuelto en un unico par de comillas rectas (simples o dobles) que
  // encierran toda la cadena, se retiran antes de validar/persistir -- ver
  // RegistroGrpcMapper#normalizarAvatar.
  string avatar = 4;
}

// Mismos campos que RegistroResponse (web/dto/RegistroResponse.java). No expone el uid del
// proveedor de identidad ni ningun dato de autenticacion.
message RegistrarUsuarioResponse {
  int64 id = 1;
  string username = 2;
  string email = 3;
  string proveedor = 4;
  bool activo = 5;
  // Instant en formato ISO-8601 (mismo formato que la serializacion JSON de Instant en la
  // respuesta REST), p. ej. "2026-09-08T20:53:47.441193Z".
  string created_at = 6;
  // Vacio si el usuario no eligio avatar. Mismo valor ya normalizado (sin comillas
  // envolventes) que quedo persistido -- ver RegistrarUsuarioRequest.avatar.
  string avatar = 7;
}

message BuscarUsuarioPorUidRequest {
  // UID que asigna Firebase Authentication al crear la cuenta (el mismo que devuelve
  // RegistrarUsuarioResponse indirectamente via el registro). Identificador opaco, no un
  // secreto, pero obligatorio. Quien llama ya verifico que quien pregunta es su dueno --
  // chat-registro no repite esa comprobacion, ver la nota del rpc arriba.
  string uid = 1;
}

message BuscarUsuarioPorUidResponse {
  string username = 1;
  string email = 2;
  // Vacio si el usuario no eligio avatar. Mismo valor ya normalizado que RegistrarUsuarioResponse.avatar.
  string avatar = 3;
}

message ExisteUsernameRequest {
  string username = 1;
}

message ExisteUsernameResponse {
  bool existe = 1;
}
