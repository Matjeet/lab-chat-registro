# Gradle necesita ejecutarse con un JDK 17+ (el codigo compila con la toolchain de Java 25).
# Si tu JAVA_HOME apunta a un JDK antiguo, descomenta y ajusta esta linea:
# org.gradle.java.home=C:\\Program Files\\Eclipse Adoptium\\jdk-25.0.4.101-hotspot

org.gradle.caching=true
org.gradle.parallel=true
# Desactivado: el plugin com.google.protobuf (generateProto, usado para los stubs de gRPC de
# registro/grpc/) todavia no serializa bien para la cache de configuracion en Gradle 9
# (GenerateProtoTask referencia un SourceDirectorySet/Project que la config cache no soporta).
# Reactivar cuando el plugin lo soporte.
org.gradle.configuration-cache=false
